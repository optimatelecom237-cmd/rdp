version: '3.8'

services:
  windows:
    image: dockur/windows
    container_name: windows10
    environment:
      VERSION: "10"
      RAM_SIZE: "4G"
      CPU_CORES: "2"
    devices:
      - /dev/kvm
    cap_add:
      - NET_ADMIN
    ports:
      - "8006:8006"
      - "3389:3389/tcp"
      - "3389:3389/udp"
    volumes:
      - windows_storage:/storage
    restart: unless-stopped

  webapp:
    image: node:18-alpine
    container_name: tailwind_app
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
    command: npm run dev
    restart: unless-stopped

volumes:
  windows_storage:
