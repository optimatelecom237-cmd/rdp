name: Windows Web Workflow

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Activer la virtualisation KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Lancer Windows via Docker
        run: |
          docker run -d --name windows10 \
            --device=/dev/kvm \
            --cap-add=NET_ADMIN \
            -p 8006:8006 \
            dockurr/windows

      - name: Configurer un tunnel SSH pour accéder à l'interface Web (Port 8006)
        run: |
          # Affiche la commande SSH à lancer depuis votre PC local pour voir Windows directement dans votre navigateur
          echo "=== COMMANDE À LANCER SUR VOTRE PC LOCAL ==="
          echo "ssh -o StrictHostKeyChecking=no -R 8006:localhost:8006 localhost.run"
          echo "============================================="

      - name: Garder la session active
        run: |
          # Le runner reste allumé pendant 2 heures
          sleep 7200
