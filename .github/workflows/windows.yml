name: Windows RDP Workflow

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Activer la virtualisation KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Lancer Windows via Docker
        run: |
          docker run -d --name windows10 \
            --device=/dev/kvm \
            --cap-add=NET_ADMIN \
            -p 8006:8006 \
            -p 3389:3389/tcp \
            -p 3389:3389/udp \
            dockurr/windows

      - name: Télécharger et installer Playit.gg directement
        run: |
          curl -SsL https://github.com/playit-cloud/playit-agent/releases/latest/download/playit-linux-amd64 -o playit
          chmod +x playit
          sudo mv playit /usr/local/bin/playit

      - name: Lancer le tunnel Playit.gg pour le RDP (3389)
        run: |
          echo "=== LIEN PLAYIT.GG (Regardez les logs pour l'adresse TCP) ==="
          playit &
          sleep 15

      - name: Garder la session active
        run: |
          # Le runner reste allumé pendant 2 heures
          sleep 7200
