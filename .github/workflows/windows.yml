name: Windows RDP Workflow

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Activer la virtualisation KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Lancer Windows via Docker
        run: |
          docker run -d --name windows10 \
            --device=/dev/kvm \
            --cap-add=NET_ADMIN \
            -p 8006:8006 \
            -p 3389:3389/tcp \
            -p 3389:3389/udp \
            dockurr/windows

      - name: Installer Node.js et LocalTunnel
        run: |
          sudo apt-get update && sudo apt-get install -y nodejs npm
          sudo npm install -g localtunnel

      - name: Ouvrir le tunnel RDP via LocalTunnel
        run: |
          nohup lt --port 3389 &
          sleep 5
          echo "=== LIEN RDP LOCALTUNNEL ==="
          curl -s https://loca.lt/mytunnelpassword || true

      - name: Garder la session active
        run: |
          # Le runner reste allumé pendant 2 heures
          sleep 7200
