name: Windows RDP Workflow

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Activer la virtualisation KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Lancer Windows via Docker
        run: |
          docker run -d --name windows10 \
            --device=/dev/kvm \
            --cap-add=NET_ADMIN \
            -p 8006:8006 \
            -p 3389:3389/tcp \
            -p 3389:3389/udp \
            dockurr/windows

      - name: Patienter le démarrage complet de Windows
        run: sleep 30

      - name: Ouvrir un tunnel TCP sécurisé via Pinggy
        run: |
          echo "=== COPIEZ L'ADRESSE TCP CI-DESSOUS POUR LE RDP ==="
          # Lance un tunnel TCP gratuit vers le port 3389
          ssh -o StrictHostKeyChecking=no -R 0:localhost:3389 tcp@a.pinggy.io &
          sleep 10
