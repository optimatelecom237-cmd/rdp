name: Windows Web Workflow

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Activer la virtualisation KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Lancer Windows 10 via Docker
        run: |
          docker run -d --name windows10 \
            --device=/dev/kvm \
            --cap-add=NET_ADMIN \
            -e VERSION="10" \
            -p 8006:8006 \
            dockurr/windows

      - name: Installer Cloudflare Tunnel (cloudflared)
        run: |
          curl -L --output cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/

      - name: Lancer le tunnel Cloudflare pour le port 8006
        run: |
          echo "=== URL D'ACCÈS CLOUDFLARE ==="
          cloudflared tunnel --url http://localhost:8006 &
          sleep 10

      - name: Garder la session active
        run: |
          # Le runner reste allumé pendant 2 heures
          sleep 7200
