name: Windows RDP Workflow

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Activer la virtualisation KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Lancer Windows via Docker
        run: |
          docker run -d --name windows10 \
            --device=/dev/kvm \
            --cap-add=NET_ADMIN \
            -p 8006:8006 \
            -p 3389:3389/tcp \
            -p 3389:3389/udp \
            dockurr/windows

      - name: Installer Playit.gg
        run: |
          curl -SsL https://playit-cloud.github.io/ppa/key.gpg | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/playit-keyring.gpg
          echo "deb [signed-by=/etc/apt/trusted.gpg.d/playit-keyring.gpg] https://playit-cloud.github.io/ppa/debian stable main" | sudo tee /etc/apt/sources.list.d/playit-cloud.list
          sudo apt update && sudo apt install -y playit

      - name: Lancer le tunnel Playit.gg pour le RDP (3389)
        run: |
          echo "=== LIEN PLAYIT.GG (Regardez les logs pour l'adresse TCP) ==="
          playit &
          sleep 15

      - name: Garder la session active
        run: |
          # Le runner reste allumé pendant 2 heures
          sleep 7200
