name: Windows RDP Workflow

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Activer la virtualisation KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          groups
          ls -l /dev/kvm

      - name: Lancer Windows via QEMU
        run: |
          docker run -d --name windows10 \
            --device=/dev/kvm \
            -p 8006:8006 \
            -p 3389:3389/tcp \
            dockurr/windows
        # Note: Si vous utilisez un token d'authentification Docker Hub, vous pouvez vous connecter avant.
