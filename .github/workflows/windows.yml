name: Windows RDP Workflow

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Activer la virtualisation KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Lancer Windows via Docker
        run: |
          docker run -d --name windows10 \
            --device=/dev/kvm \
            --cap-add=NET_ADMIN \
            -p 8006:8006 \
            -p 3389:3389/tcp \
            -p 3389:3389/udp \
            dockurr/windows

      - name: Installer Ngrok
        run: |
          curl -sSL https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz -o ngrok.tgz
          sudo tar -xzf ngrok.tgz -C /usr/local/bin
          rm ngrok.tgz
          ngrok config add-authtoken ${{ secrets.NGROK_AUTHTOKEN }}

      - name: Ouvrir le tunnel RDP via Ngrok
        run: |
          nohup ngrok tcp 3389 --region eu &
          sleep 5
          echo "=== LIEN RDP NGROK ==="
          curl -s http://localhost:4040/api/tunnels | grep -o '"public_url":"[^"]*"'

      - name: Garder la session active
        run: |
          # Le runner reste allumé pendant 2 heures pour vous laisser travailler
          sleep 7200
